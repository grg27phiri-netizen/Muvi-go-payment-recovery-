<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101015">
<title>MUVI GO Viewer Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#09090d;color:#fff;
font-family:system-ui,sans-serif}
header{padding:20px;background:#15141a;border-bottom:1px solid #69502f}
.brand{font-size:24px;font-weight:950;color:#fff}
.brand b{color:#ff9b32}
main{max-width:560px;margin:auto;padding:22px 16px}
.welcome,.tile,.account{padding:20px;margin-bottom:15px;
border:1px solid #57432b;border-radius:17px;
background:linear-gradient(145deg,#211e19,#15151b)}
.eyebrow{color:#e9ad5c;font-size:11px;letter-spacing:2px;font-weight:800}
h1{font-size:29px;margin:10px 0}
p{color:#aaa6a0;font-size:13px;line-height:1.6}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{min-height:115px;text-decoration:none;color:#f2c47d;
font-size:15px;font-weight:850;display:flex;flex-direction:column;
justify-content:center;gap:9px}
.tile span{font-size:25px}
.account strong{color:#f2c47d}
button{width:100%;padding:14px;border:1px solid #a27a42;
border-radius:12px;background:#211e19;color:#f2c47d;
font-weight:800;font-size:14px}
</style>
</head>
<body>
<header><div class="brand">MUVI <b>GO</b></div></header>
<main>
<section class="welcome">
<p class="eyebrow">VIEWER DASHBOARD</p>
<h1>Welcome, {{ user['name'] }}</h1>
<p>Your MUVI GO account and entertainment hub.</p>
</section>
<section class="tiles">
<a class="tile" href="/"><span>▶</span>Watch Live TV</a>
<a class="tile" href="/"><span>🎬</span>Explore Movies</a>
<a class="tile" href="/"><span>♫</span>Music and Series</a>
<a class="tile" href="/"><span>☻</span>My MUVI GO</a>
</section>
<section class="account">
<p class="eyebrow">ACCOUNT DETAILS</p>
<p>Name: <strong>{{ user['name'] }}</strong></p>
<p>Email: <strong>{{ user['email'] }}</strong></p>
<p>Account type: <strong>Viewer</strong></p>
</section>
<button id="logout" type="button">Sign Out</button>
</main>
<script>
document.getElementById("logout").addEventListener("click", async () => {
  const response = await fetch("/api/auth/logout", {
    method: "POST",
    credentials: "same-origin",
    headers: {"Content-Type": "application/json"},
    body: "{}"
  });
  if (response.ok) location.assign("/");
  else alert("Unable to sign out. Please try again.");
});
</script>
</body>
</html>
